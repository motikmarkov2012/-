<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Команда Баба Яга - История развития проекта</title>
    <!-- Официальный движок Google Model-Viewer для запуска нативного AR на iOS и Android -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        :root {
            --primary-green: #2e7d32;
            --dark-green: #1b5e20;
            --light-green: #e8f5e9;
            /* Ультра жидкое стекло */
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.85);
            --glass-shadow: 0 12px 40px 0 rgba(46, 125, 50, 0.18);
            --text-main: #0f172a;
            --text-muted: #334155;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #c8e6c9 0%, #a3d9c9 50%, #e8f5e9 100%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 40px 20px 10px 20px;
            width: 100%;
            box-sizing: border-box;
        }

        header h1 {
            margin: 0 0 6px 0;
            font-size: 2.5rem;
            color: var(--dark-green);
            letter-spacing: -0.5px;
            font-weight: 800;
        }

        header p {
            margin: 0;
            font-size: 1.25rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        main {
            width: 100%;
            max-width: 950px;
            padding: 20px;
            box-sizing: border-box;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Эффект супер жидкого стекла */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--glass-shadow);
        }

        .info-section h2 {
            margin-top: 0;
            color: var(--dark-green);
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .info-section p {
            line-height: 1.6;
            color: var(--text-muted);
            margin: 0;
            font-size: 1.05rem;
        }

        .content-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Таймлайн: плавная лента при прокрутке страницы */
        .timeline-scroll-container {
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid var(--glass-border);
            margin-bottom: 30px;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .timeline-track {
            display: flex;
            width: max-content;
            animation: scrollTimeline linear;
            animation-timeline: scroll();
        }

        .timeline-track img {
            height: 300px;
            width: auto;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            margin-right: 30px;
            display: block;
            object-fit: contain;
        }

        @keyframes scrollTimeline {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* Настройка компонента AR */
        model-viewer {
            width: 100%;
            height: 100px;
            background-color: transparent;
            --poster-color: transparent;
        }

        /* Кнопка запуска реальной камеры (AR) с подсветкой */
        .camera-button {
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 18px 36px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(46, 125, 50, 0.4);
            width: 100%;
            max-width: 400px;
        }

        .camera-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(27, 94, 32, 0.6);
            background: linear-gradient(135deg, #388e3c 0%, #2e7d32 100%);
        }

        .camera-button:active {
            transform: translateY(1px);
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <h1>Команда Баба Яга</h1>
        <p>История развития проекта</p>
    </header>

    <main>
        <section class="glass-card info-section">
            <h2>О проекте</h2>
            <p>
                Добро пожаловать в презентацию нашей команды. Прокручивайте страницу вниз, 
                чтобы изучить таймлайн, или нажмите кнопку ниже, чтобы включить камеру 
                и рассмотреть проект в реальном пространстве, обходя его со всех сторон.
            </p>
        </section>

        <section class="glass-card content-container">
            <!-- Бесконечная лента таймлайна -->
            <div class="timeline-scroll-container">
                <div class="timeline-track">
                    <img src="izbushka_card.jpg" alt="Этап проекта">
                    <img src="izbushka_card.jpg" alt="Этап проекта">
                    <img src="izbushka_card.jpg" alt="Этап проекта">
                </div>
            </div>

            <!-- 
              Компонент для запуска реальной AR-камеры телефона.
              iOS откроет Quick Look (формат .usdz), Android откроет Scene Viewer (формат .glb).
            -->
            <model-viewer 
                src="izbushka_card.glb" 
                ios-src="izbushka_card.usdz" 
                ar 
                ar-modes="webxr scene-viewer quick-look" 
                camera-controls 
                alt="Проект в дополненной реальности">
                
                <button slot="ar-button" class="camera-button">
                    Открыть камеру
                </button>
            </model-viewer>
        </section>
    </main>

    <footer>
        <p>GitHub Pages</p>
    </footer>

</body>
</html>
