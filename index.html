<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Баба Яга — AR</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;
        }

        /*
         * Скрываем кнопку Three.js до запуска AR.
         * Сам canvas появляется поверх экрана.
         */
        #ar-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            display: none;
        }

        #ar-canvas.active {
            display: block;
        }

        /*
         * UI поверх камеры
         */
        #ar-ui {
            position: fixed;
            inset: 0;
            z-index: 40;
            pointer-events: none;
            display: none;
        }

        #ar-ui.active {
            display: block;
        }

        #ar-close {
            pointer-events: auto;
        }

        #ar-hint {
            pointer-events: none;
        }
    </style>
</head>


<body
    class="
        bg-zinc-950
        text-zinc-100
        h-screen
        w-screen
        overflow-hidden
        flex
        flex-col
        justify-between
        select-none
    "
>


<!-- =====================================================
     ШАПКА
===================================================== -->

<header
    class="
        w-full
        p-6
        flex
        justify-between
        items-center
        border-b
        border-zinc-900
        z-10
    "
>

    <h1
        class="
            text-xs
            tracking-widest
            uppercase
            text-zinc-500
        "
    >
        Баба Яга
    </h1>


    <span
        class="
            text-xs
            text-blue-500
        "
    >
        AR
    </span>

</header>



<!-- =====================================================
     ГЛАВНЫЙ ЭКРАН
===================================================== -->

<main
    id="welcome-screen"
    class="
        flex-1
        flex
        flex-col
        items-center
        justify-center
        px-4
    "
>

    <button
        id="open-ar-btn"
        class="
            px-8
            py-4
            bg-blue-600
            hover:bg-blue-500
            text-white
            text-sm
            font-medium
            tracking-wide
            transition-colors
            shadow-lg
            shadow-blue-950/50
        "
    >
        Запустить камеру
    </button>

</main>



<!-- =====================================================
     AR CANVAS
===================================================== -->

<canvas
    id="ar-canvas"
></canvas>



<!-- =====================================================
     UI ПОВЕРХ AR
===================================================== -->

<div
    id="ar-ui"
>


    <!-- Кнопка выхода -->

    <button
        id="ar-close"
        class="
            absolute
            top-5
            right-5
            w-12
            h-12
            rounded-full
            bg-black/50
            border
            border-zinc-700
            text-white
            text-xl
            backdrop-blur-md
        "
    >
        ✕
    </button>


    <!-- Подсказка -->

    <div
        id="ar-hint"
        class="
            absolute
            bottom-6
            left-1/2
            -translate-x-1/2
            bg-black/50
            border
            border-zinc-800
            px-5
            py-3
            text-xs
            text-zinc-300
            backdrop-blur-md
            whitespace-nowrap
        "
    >
        Ходи вокруг фотографии
    </div>


</div>



<!-- =====================================================
     СООБЩЕНИЕ
===================================================== -->

<div
    id="message"
    class="
        fixed
        inset-0
        z-50
        bg-black/80
        hidden
        items-center
        justify-center
        px-5
    "
>

    <div
        class="
            bg-zinc-900
            border
            border-zinc-800
            p-6
            max-w-sm
            w-full
            shadow-2xl
        "
    >

        <h2
            id="message-title"
            class="
                text-lg
                font-medium
                mb-3
            "
        >
            AR недоступен
        </h2>


        <p
            id="message-text"
            class="
                text-sm
                text-zinc-400
                leading-6
            "
        >
        </p>


        <button
            id="message-close"
            class="
                mt-5
                px-5
                py-2.5
                bg-blue-600
                hover:bg-blue-500
                text-sm
            "
        >
            Закрыть
        </button>

    </div>

</div>



<!-- =====================================================
     THREE.JS
===================================================== -->

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";



/* =====================================================
   ELEMENTS
===================================================== */

const openArBtn =
    document.getElementById("open-ar-btn");

const welcomeScreen =
    document.getElementById("welcome-screen");

const canvas =
    document.getElementById("ar-canvas");

const arUI =
    document.getElementById("ar-ui");

const closeBtn =
    document.getElementById("ar-close");

const message =
    document.getElementById("message");

const messageTitle =
    document.getElementById("message-title");

const messageText =
    document.getElementById("message-text");

const messageClose =
    document.getElementById("message-close");



/* =====================================================
   THREE
===================================================== */

const renderer =
    new THREE.WebGLRenderer({

        canvas: canvas,

        antialias: true,

        alpha: true

    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


/*
 * Включаем WebXR
 */

renderer.xr.enabled = true;



const scene =
    new THREE.Scene();



const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        0.01,
        100
    );



/* =====================================================
   ФОТО
===================================================== */

const loader =
    new THREE.TextureLoader();


const photoTexture =
    loader.load(
        "izbushka_card.jpg"
    );


photoTexture.colorSpace =
    THREE.SRGBColorSpace;



/* =====================================================
   ОБЪЕКТ ФОТОГРАФИИ
===================================================== */

const photoObject =
    new THREE.Group();


/*
 * Начальный наклон 45°
 */

photoObject.rotation.y =
    THREE.MathUtils.degToRad(45);



/*
 * Объект находится примерно
 * на уровне глаз.
 */

photoObject.position.set(
    0,
    1.4,
    -2
);


scene.add(photoObject);



/* =====================================================
   СОЗДАЁМ ФОТО ПО ПРОПОРЦИЯМ
===================================================== */

let photoReady = false;


photoTexture.image.onload =
    () => {

        createPhoto();

    };


/*
 * Иногда картинка успевает загрузиться
 * раньше обработчика.
 */

if (photoTexture.image.complete) {

    createPhoto();

}



/* =====================================================
   СОЗДАНИЕ
===================================================== */

function createPhoto() {

    if (photoReady)
        return;

    photoReady = true;


    const image =
        photoTexture.image;


    const aspect =
        image.width /
        image.height;


    /*
     * Высота объекта в метрах.
     */

    const height =
        2.2;


    /*
     * Ширина рассчитывается
     * автоматически.

     * Поэтому если потом у тебя будет
     * огромная горизонтальная фотография,
     * она сама станет широкой.
     */

    const width =
        height * aspect;


    /*
     * Максимальная ширина,
     * чтобы объект совсем не
     * оказался гигантским.
     */

    const finalWidth =
        Math.min(
            width,
            8
        );


    const finalHeight =
        finalWidth / aspect;



    /* =================================================
       ЧЁРНАЯ ОСНОВА
    ================================================= */

    const thickness =
        0.04;


    const boxGeometry =
        new THREE.BoxGeometry(
            finalWidth,
            finalHeight,
            thickness
        );


    const blackMaterial =
        new THREE.MeshBasicMaterial({
            color: 0x000000
        });


    const body =
        new THREE.Mesh(
            boxGeometry,
            blackMaterial
        );


    photoObject.add(body);



    /* =================================================
       ПЕРЕДНЯЯ СТОРОНА
    ================================================= */

    const frontGeometry =
        new THREE.PlaneGeometry(
            finalWidth,
            finalHeight
        );


    const frontMaterial =
        new THREE.MeshBasicMaterial({

            map: photoTexture,

            transparent: true,

            opacity: 1,

            side: THREE.FrontSide

        });


    const front =
        new THREE.Mesh(
            frontGeometry,
            frontMaterial
        );


    front.position.z =
        thickness / 2 + 0.002;


    /*
     * Именно фотография.
     */

    photoObject.add(front);



    /* =================================================
       ЗАДНЯЯ СТОРОНА
    ================================================= */

    const backGeometry =
        new THREE.PlaneGeometry(
            finalWidth,
            finalHeight
        );


    const backMaterial =
        new THREE.MeshBasicMaterial({

            color: 0x000000,

            side: THREE.FrontSide

        });


    const back =
        new THREE.Mesh(
            backGeometry,
            backMaterial
        );


    back.rotation.y =
        Math.PI;


    back.position.z =
        -thickness / 2 - 0.002;


    photoObject.add(back);



    /*
     * Сохраняем ссылку,
     * чтобы дальше можно было
     * управлять прозрачностью.
     */

    photoObject.userData.front =
        front;

}



/* =====================================================
   НАСТОЯЩИЙ AR
===================================================== */

async function startAR() {

    /*
     * Проверяем поддержку WebXR.
     */

    if (!navigator.xr) {

        showMessage(
            "AR недоступен",
            "Этот браузер не предоставляет WebXR. " +
            "Открой сайт на устройстве с поддержкой AR."
        );

        return;

    }



    let supported = false;


    try {

        supported =
            await navigator.xr.isSessionSupported(
                "immersive-ar"
            );

    } catch(error) {

        console.error(error);

    }



    if (!supported) {

        showMessage(
            "AR недоступен",
            "Это устройство или браузер не поддерживает " +
            "настоящий WebXR AR-режим."
        );

        return;

    }



    try {

        /*
         * Запрашиваем настоящую AR-сессию.
         */

        const session =
            await navigator.xr.requestSession(

                "immersive-ar",

                {
                    requiredFeatures: [
                        "local-floor"
                    ]
                }

            );


        /*
         * Передаём сессию Three.js.
         */

        await renderer.xr.setSession(
            session
        );


        /*
         * Показываем AR.
         */

        canvas.classList.add(
            "active"
        );


        arUI.classList.add(
            "active"
        );


        welcomeScreen.classList.add(
            "hidden"
        );



        /*
         * Когда AR закрывается.
         */

        session.addEventListener(
            "end",
            () => {

                canvas.classList.remove(
                    "active"
                );

                arUI.classList.remove(
                    "active"
                );

                welcomeScreen.classList.remove(
                    "hidden"
                );

                renderer.setAnimationLoop(
                    null
                );

            }
        );



        /*
         * Запускаем рендер.
         */

        renderer.setAnimationLoop(
            render
        );


    } catch(error) {

        console.error(error);


        showMessage(
            "Не удалось открыть AR",
            "Браузер не смог запустить AR-режим. " +
            "Проверь разрешение камеры и попробуй ещё раз."
        );

    }

}



/* =====================================================
   РЕНДЕР
===================================================== */

function render(
    time,
    frame
) {

    /*
     * Реальная камера телефона
     * управляется самим WebXR.
     */


    /*
     * Движение фотографии
     * влево → вправо → влево.

     * Амплитуда большая, специально
     * под будущую длинную фотографию.
     */

    const seconds =
        performance.now() / 1000;


    const movement =
        Math.sin(
            seconds * 0.65
        ) * 2.5;


    photoObject.position.x =
        movement;


    /*
     * Можно добавить совсем небольшое
     * плавное движение самого объекта.
     */

    photoObject.rotation.z =
        Math.sin(
            seconds * 0.35
        ) * 0.015;


    renderer.render(
        scene,
        camera
    );

}



/* =====================================================
   ЗАКРЫТИЕ
===================================================== */

closeBtn.addEventListener(
    "click",
    async () => {

        const session =
            renderer.xr.getSession();


        if (session) {

            await session.end();

        }

    }
);



/* =====================================================
   ЗАПУСК
===================================================== */

openArBtn.addEventListener(
    "click",
    () => {

        startAR();

    }
);



/* =====================================================
   СООБЩЕНИЕ
===================================================== */

function showMessage(
    title,
    text
) {

    messageTitle.textContent =
        title;

    messageText.textContent =
        text;

    message.classList.remove(
        "hidden"
    );

    message.classList.add(
        "flex"
    );

}



messageClose.addEventListener(
    "click",
    () => {

        message.classList.add(
            "hidden"
        );

        message.classList.remove(
            "flex"
        );

    }
);



/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
