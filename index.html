<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймлайн проекта «Баба Яга» — AR</title>
    <!-- Подключаем официальный компонент для 3D и AR -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            text-align: center;
        }

        header {
            padding: 15px;
            background: #1f1f1f;
            border-bottom: 2px solid #ff4757;
        }

        h1 {
            font-size: 18px;
            margin: 0;
        }

        /* Контейнер для 3D/AR сцены */
        model-viewer {
            width: 100%;
            height: 60vh;
            background-color: #1a1a1a;
        }

        /* Кнопка запуска камеры (AR) */
        #ar-button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transition: 0.2s;
        }

        #ar-button:active {
            transform: scale(0.95);
        }

        .timeline-info {
            padding: 15px;
            background: #1a1a1a;
            margin: 10px;
            border-radius: 12px;
            display: inline-block;
            max-width: 90%;
        }

        .timeline-info p {
            margin: 5px 0;
            color: #ccc;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Проект «Баба Яга» — AR Таймлайн</h1>
    </header>

    <!-- Сцена с избушкой / моделью -->
    <model-viewer 
        id="babayaga-viewer"
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
        ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
        alt="Избушка Бабы Яги"
        ar
        ar-modes="scene-viewer quick-look webxr"
        camera-controls
        auto-rotate
        shadow-intensity="1">
        
        <!-- Кнопка перехода в камеру телефона -->
        <button slot="ar-button" id="ar-button">
            📷 Открыть камеру и ходить вокруг
        </button>
    </model-viewer>

    <div class="timeline-info">
        <p><b>Текущий этап:</b> Запуск проекта</p>
        <p>Используется фото: <code>izbushka_card.jpg</code></p>
        <p style="color: #ff4757; font-size: 12px;">Нажми кнопку выше, чтобы запустить AR на телефоне!</p>
    </div>

</body>
</html>
