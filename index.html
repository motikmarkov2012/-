<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймлайн проекта «Баба Яга» — AR</title>
    <!-- Подключаем официальный компонент Google Model Viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            text-align: center;
        }

        header {
            padding: 12px;
            background: #1c1c1e;
            border-bottom: 1px solid #333;
        }

        h1 {
            font-size: 16px;
            margin: 0;
        }

        /* Область предпросмотра 3D */
        model-viewer {
            width: 100vw;
            height: 50vh;
            background-color: #1a1a1a;
        }

        /* Кнопка запуска AR-камеры */
        #ar-button {
            background: #007aff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
        }

        /* Панель таймлайна */
        .timeline-container {
            padding: 20px;
            background: #1c1c1e;
            margin: 15px;
            border-radius: 14px;
        }

        .timeline-container p {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: #bbb;
        }

        .buttons-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .buttons-group button {
            background: #2c2c2e;
            color: white;
            border: 1px solid #007aff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }

        .buttons-group button:active {
            background: #007aff;
        }
    </style>
</head>
<body>

    <header>
        <h1>Проект «Баба Яга» — AR Таймлайн</h1>
    </header>

    <!-- 
      Главный компонент AR:
      - ios-src: файл для iPhone (.usdz)
      - src: файл для Android (.glb)
      Если этих файлов нет в папке сайта, айфон сбросит страницу. 
    -->
    <model-viewer 
        id="babayaga-viewer"
        src="izbushka_card.glb" 
        ios-src="izbushka_card.usdz"
        alt="Избушка Бабы Яги"
        ar
        ar-modes="quick-look scene-viewer webxr"
        camera-controls
        orientation="0deg 45deg 0deg"
        shadow-intensity="1">
        
        <!-- Кнопка вызова камеры -->
        <button slot="ar-button" id="ar-button">
            📦 Запустить AR камеру
        </button>
    </model-viewer>

    <!-- Блок таймлайна -->
    <div class="timeline-container">
        <p id="stage-text"><b>Этап 1:</b> Зарождение идеи</p>
        <div class="buttons-group">
            <button onclick="setStage(1, 'Зарождение идеи')">Шаг 1</button>
            <button onclick="setStage(2, 'Создание прототипа')">Шаг 2</button>
            <button onclick="setStage(3, 'Финальный проект')">Шаг 3</button>
        </div>
    </div>

    <script>
        function setStage(step, text) {
            document.getElementById('stage-text').innerHTML = `<b>Этап ${step}:</b> ${text}`;
        }
    </script>

</body>
</html>
