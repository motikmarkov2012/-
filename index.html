<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймлайн проекта «Баба Яга» — AR Камера</title>
    <!-- Подключаем библиотеку Model-Viewer с поддержкой AR для iPhone и Android -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f0f0f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            text-align: center;
        }

        header {
            padding: 12px;
            background: #1a1a1a;
            border-bottom: 2px solid #ff4757;
        }

        h1 {
            font-size: 16px;
            margin: 0;
        }

        /* Контейнер для 3D-сцены и AR */
        model-viewer {
            width: 100vw;
            height: 55vh;
            background-color: #141414;
        }

        /* Кнопка запуска камеры */
        #ar-button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 14px 26px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 71, 87, 0.5);
            transition: transform 0.2s;
        }

        #ar-button:active {
            transform: scale(0.95);
        }

        /* Панель таймлайна под сценой */
        .timeline-panel {
            padding: 15px;
            background: #1a1a1a;
            margin: 10px;
            border-radius: 14px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .timeline-panel p {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #ddd;
        }

        .stages {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .stages button {
            background: #333;
            color: white;
            border: 1px solid #ff4757;
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .stages button:hover {
            background: #ff4757;
        }
    </style>
</head>
<body>

    <header>
        <h1>Проект «Баба Яга» — AR Таймлайн</h1>
    </header>

    <!-- 
      Используем model-viewer с твоей фотографией. 
      Чтобы картинка отображалась в 3D и AR под углом 45 градусов, 
      мы задаем начальную ориентацию камеры через атрибуты.
    -->
    <model-viewer 
        id="ar-card"
        src="" 
        ios-src=""
        alt="Избушка Бабы Яга"
        ar
        ar-modes="scene-viewer quick-look webxr"
        camera-controls
        touch-action="pan-y"
        orientation="0deg 45deg 0deg"
        exposure="1"
        shadow-intensity="1">
        
        <!-- Кнопка, по которой открывается камера телефона -->
        <button slot="ar-button" id="ar-button">
            📷 Открыть камеру и ходить вокруг
        </button>
    </model-viewer>

    <!-- Блок таймлайна истории -->
    <div class="timeline-panel">
        <p id="stage-desc"><b>Этап 1:</b> Старт проекта и создание фотокарточки</p>
        <div class="stages">
            <button onclick="changeStage(1, 'Старт проекта и создание фотокарточки')">Шаг 1</button>
            <button onclick="changeStage(2, 'Разработка концепции избушки')">Шаг 2</button>
            <button onclick="changeStage(3, 'Финальный релиз проекта')">Шаг 3</button>
        </div>
    </div>

    <script>
        // Функция переключения текста этапов таймлайна
        function changeStage(num, text) {
            document.getElementById('stage-desc').innerHTML = `<b>Этап ${num}:</b> ${text}`;
        }
    </script>

</body>
</html>
