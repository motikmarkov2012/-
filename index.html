<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Команда Баба Яга — Просмотр фото</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Официальный движок model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen w-screen overflow-hidden flex flex-col justify-between select-none">

    <!-- Минималистичная шапка -->
    <header class="w-full p-6 flex justify-between items-center border-b border-zinc-900 z-10">
        <h1 class="text-xs tracking-widest uppercase text-zinc-500">Команда Баба Яга</h1>
        <span class="text-xs text-green-500">AR Режим</span>
    </header>

    <!-- Главный экран с кнопкой запуска камеры -->
    <main id="welcome-screen" class="flex-1 flex flex-col items-center justify-center px-4">
        <button id="open-ar-btn" class="px-8 py-4 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium tracking-wide transition-colors shadow-lg shadow-emerald-950/50 rounded-xl cursor-pointer">
            Запустить камеру и ходить вокруг фото
        </button>
    </main>

    <!-- Экран просмотрщика -->
    <div id="viewer-container" class="absolute inset-0 pt-20 pb-6 px-4 flex flex-col justify-between hidden bg-zinc-950">
        
        <div class="flex-1 w-full h-full relative">
            <!-- 
              Здесь src сразу указывает на твою картинку izbushka_card.jpg. 
              Движок автоматически преобразует её в плоскость для AR.
            -->
            <model-viewer 
                id="ar-model-viewer"
                src="izbushka_card.jpg" 
                ar 
                ar-modes="webxr scene-viewer quick-look"
                ar-scale="fixed"
                camera-controls 
                class="w-full h-full cursor-pointer">
            </model-viewer>
        </div>
    </div>

    <script>
        const openArBtn = document.getElementById('open-ar-btn');
        const welcomeScreen = document.getElementById('welcome-screen');
        const viewerContainer = document.getElementById('viewer-container');
        const modelViewer = document.getElementById('ar-model-viewer');

        // При клике сразу пробуем активировать AR-камеру телефона
        openArBtn.addEventListener('click', async () => {
            try {
                welcomeScreen.classList.add('hidden');
                viewerContainer.classList.remove('hidden');
                // Запуск нативной камеры устройства
                await modelViewer.activateAR();
            } catch (error) {
                // Если AR не поддерживается напрямую, останется интерактивный просмотр на экране
                console.log("AR режим открыт в интерактивном окне браузера");
            }
        });
    </script>
</body>
</html>
