<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Команда Баба Яга — AR Просмотр</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Движок WebAR для работы с обычными изображениями без .glb -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        /* Скрываем служебные блоки A-Frame */
        .a-enter-vr { display: none !important; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 select-none">

    <!-- Стартовый экран в твоем стиле -->
    <div id="start-screen" class="fixed inset-0 z-50 flex flex-col justify-between p-6 bg-zinc-950">
        <header class="w-full flex justify-between items-center border-b border-zinc-900 pb-4">
            <h1 class="text-xs tracking-widest uppercase text-zinc-500">Команда Баба Яга</h1>
            <span class="text-xs text-emerald-500">AR Camera</span>
        </header>

        <main class="flex-1 flex flex-col items-center justify-center text-center px-4">
            <h2 class="text-xl font-semibold mb-2">Просмотр фото в AR</h2>
            <p class="text-sm text-zinc-400 mb-8 max-w-xs">
                Нажмите кнопку, разрешите доступ к камере и перед вами появится фото в реальном пространстве.
            </p>
            
            <button id="start-ar-btn" class="px-8 py-4 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium tracking-wide transition-colors shadow-lg shadow-emerald-950/50 rounded-xl cursor-pointer">
                Запустить камеру (AR)
            </button>
        </main>

        <footer class="text-center text-xs text-zinc-600">
            GitHub Pages (HTTPS)
        </footer>
    </div>

    <!-- AR Сцена (открывается при нажатии) -->
    <a-scene 
        id="ar-scene"
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false"
        class="hidden">
        
        <a-assets>
            <img id="izbushka-img" src="izbushka_card.jpg">
        </a-assets>

        <!-- 
            Плоскость с вашей картинкой izbushka_card.jpg 
            position="0 1.2 -2" выставляет фото прямо перед вами в 2 метрах
        -->
        <a-image 
            src="#izbushka-img" 
            position="0 1.2 -2" 
            width="2.2" 
            height="1.4"
            rotation="0 0 0">
        </a-image>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const startBtn = document.getElementById('start-ar-btn');
        const startScreen = document.getElementById('start-screen');
        const arScene = document.getElementById('ar-scene');

        startBtn.addEventListener('click', () => {
            // Скрываем начальный экран и запускаем камеру
            startScreen.classList.add('hidden');
            arScene.classList.remove('hidden');
        });
    </script>
</body>
</html>
