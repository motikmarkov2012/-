<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Баба Яга — AR</title>

    <!-- Интерфейс -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- model-viewer -->
    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js">
    </script>

    <style>
        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background: transparent;
        }

        #viewer-container {
            z-index: 20;
        }

        #loading {
            display: flex;
        }

        #loading.hidden {
            display: none;
        }
    </style>
</head>


<body
    class="
        bg-zinc-950
        text-zinc-100
        h-screen
        w-screen
        overflow-hidden
        flex
        flex-col
        justify-between
        select-none
    "
>


<!-- =====================================================
     ШАПКА
===================================================== -->

<header
    class="
        w-full
        p-6
        flex
        justify-between
        items-center
        border-b
        border-zinc-900
        z-10
    "
>

    <h1
        class="
            text-xs
            tracking-widest
            uppercase
            text-zinc-500
        "
    >
        Баба Яга
    </h1>

    <span class="text-xs text-blue-500">
        AR
    </span>

</header>



<!-- =====================================================
     ГЛАВНЫЙ ЭКРАН
===================================================== -->

<main
    id="welcome-screen"
    class="
        flex-1
        flex
        flex-col
        items-center
        justify-center
        px-4
    "
>

    <div
        id="loading"
        class="
            fixed
            inset-0
            bg-zinc-950
            items-center
            justify-center
            z-50
            hidden
        "
    >

        <div class="text-center">

            <div
                class="
                    w-6
                    h-6
                    border-2
                    border-zinc-700
                    border-t-blue-500
                    rounded-full
                    animate-spin
                    mx-auto
                    mb-4
                "
            ></div>

            <div
                class="
                    text-xs
                    text-zinc-500
                "
            >
                Подготавливаем фотографию...
            </div>

        </div>

    </div>


    <button
        id="open-ar-btn"
        disabled
        class="
            px-8
            py-4
            bg-blue-600
            hover:bg-blue-500
            disabled:bg-zinc-800
            disabled:text-zinc-500
            text-white
            text-sm
            font-medium
            tracking-wide
            transition-colors
            shadow-lg
            shadow-blue-950/50
        "
    >
        Запустить камеру
    </button>

</main>



<!-- =====================================================
     3D VIEWER
===================================================== -->

<div
    id="viewer-container"
    class="
        absolute
        inset-0
        pt-20
        pb-6
        px-4
        hidden
        bg-zinc-950
    "
>


    <!-- =================================================
         VIEWER
    ================================================= -->

    <div class="flex-1 w-full h-full relative">


        <model-viewer
            id="ar-model-viewer"

            ar

            ar-modes="
                scene-viewer
                quick-look
                webxr
            "

            ar-scale="fixed"

            camera-controls

            touch-action="pan-y"

            interaction-prompt="none"

            shadow-intensity="0.7"

            exposure="1"

            autoplay

            style="
                width:100%;
                height:100%;
            "
        >
        </model-viewer>


    </div>



    <!-- =================================================
         НИЖНЯЯ ПОДСКАЗКА
    ================================================= -->

    <div
        class="
            absolute
            bottom-5
            left-1/2
            -translate-x-1/2
            bg-zinc-900/80
            border
            border-zinc-800
            px-5
            py-3
            backdrop-blur-md
            text-xs
            text-zinc-400
            shadow-xl
        "
    >

        В AR можно ходить вокруг фотографии

    </div>

</div>



<!-- =====================================================
     СООБЩЕНИЕ
===================================================== -->

<div
    id="message"
    class="
        fixed
        inset-0
        bg-black/80
        z-50
        hidden
        items-center
        justify-center
        px-5
    "
>

    <div
        class="
            bg-zinc-900
            border
            border-zinc-800
            p-6
            max-w-sm
            w-full
        "
    >

        <h2
            id="message-title"
            class="
                text-lg
                font-medium
                mb-3
            "
        >
            Ошибка
        </h2>


        <p
            id="message-text"
            class="
                text-sm
                text-zinc-400
                leading-6
            "
        >
        </p>


        <button
            id="message-close"
            class="
                mt-5
                px-5
                py-2.5
                bg-blue-600
                hover:bg-blue-500
                text-sm
            "
        >
            Закрыть
        </button>

    </div>

</div>



<!-- =====================================================
     THREE.JS + GLTF EXPORTER
===================================================== -->

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


import { GLTFExporter } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/exporters/GLTFExporter.js";



/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const openArBtn =
    document.getElementById(
        "open-ar-btn"
    );


const welcomeScreen =
    document.getElementById(
        "welcome-screen"
    );


const viewerContainer =
    document.getElementById(
        "viewer-container"
    );


const modelViewer =
    document.getElementById(
        "ar-model-viewer"
    );


const loading =
    document.getElementById(
        "loading"
    );


const message =
    document.getElementById(
        "message"
    );


const messageTitle =
    document.getElementById(
        "message-title"
    );


const messageText =
    document.getElementById(
        "message-text"
    );


const messageClose =
    document.getElementById(
        "message-close"
    );



/* =====================================================
   НАСТРОЙКИ ФОТО
===================================================== */

/*
 * Высота фотографии в AR.
 */

const PHOTO_HEIGHT = 2.4;


/*
 * Для очень длинной фотографии
 * допускаем большую ширину.
 */

const MAX_WIDTH = 20;


/*
 * Насколько фотография будет
 * автоматически ездить влево-вправо.
 */

const MOVE_DISTANCE = 2.5;


/*
 * Время одного полного прохода.
 */

const MOVE_TIME = 8;



/* =====================================================
   СОЗДАЁМ 3D МОДЕЛЬ ИЗ JPG
===================================================== */

async function createARModel() {

    /*
     * Загружаем фотографию.
     */

    const image =
        await loadImage(
            "izbushka_card.jpg"
        );


    /*
     * Считаем реальные пропорции.
     */

    const aspect =
        image.width /
        image.height;


    let height =
        PHOTO_HEIGHT;


    let width =
        height * aspect;


    /*
     * Сохраняем широкие пропорции,
     * но не даём модели стать
     * абсолютно огромной.
     */

    if(width > MAX_WIDTH) {

        width = MAX_WIDTH;

        height =
            width / aspect;

    }


    /* =================================================
       THREE SCENE
    ================================================= */

    const scene =
        new THREE.Scene();


    /*
     * Группа будет двигаться
     * автоматически.
     */

    const movingGroup =
        new THREE.Group();


    /*
     * Наклоняем фотографию примерно
     * на 45 градусов.
     */

    movingGroup.rotation.y =
        THREE.MathUtils.degToRad(45);


    scene.add(
        movingGroup
    );



    /* =================================================
       ТЕКСТУРА
    ================================================= */

    const texture =
        new THREE.Texture(
            image
        );


    texture.needsUpdate =
        true;


    texture.colorSpace =
        THREE.SRGBColorSpace;



    /* =================================================
       МАТЕРИАЛ ФОТО
    ================================================= */

    const photoMaterial =
        new THREE.MeshStandardMaterial({

            map: texture,

            roughness: 1,

            metalness: 0

        });



    /* =================================================
       ЧЁРНЫЙ МАТЕРИАЛ
    ================================================= */

    const blackMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x000000,

            roughness: 1,

            metalness: 0

        });



    /* =================================================
       ОБЪЕКТ

       Небольшая толщина создаёт
       настоящий перед и зад.
    ================================================= */

    const thickness =
        0.05;


    const geometry =
        new THREE.BoxGeometry(

            width,

            height,

            thickness

        );


    /*
     * BoxGeometry имеет 6 сторон:

     * 0 — +X
     * 1 — -X
     * 2 — +Y
     * 3 — -Y
     * 4 — +Z
     * 5 — -Z
     *
     * Фотография будет спереди.
     * Задняя сторона чёрная.
     */

    const materials = [

        blackMaterial,
        blackMaterial,
        blackMaterial,
        blackMaterial,

        photoMaterial,

        blackMaterial

    ];


    const photoMesh =
        new THREE.Mesh(
            geometry,
            materials
        );


    movingGroup.add(
        photoMesh
    );



    /* =================================================
       АНИМАЦИЯ

       -2.5 → +2.5 → -2.5

       Поэтому фотография будет
       ездить туда-сюда бесконечно.
    ================================================= */

    const times = [
        0,
        MOVE_TIME / 2,
        MOVE_TIME
    ];


    const values = [

        -MOVE_DISTANCE,
         0,

         MOVE_DISTANCE,

         0,

        -MOVE_DISTANCE

    ];


    /*
     * Для VectorKeyframeTrack
     * нужно 3 значения на каждый
     * кадр: X,Y,Z.

     * Поэтому делаем отдельные
     * ключи вручную.
     */

    const positionValues = [

        -MOVE_DISTANCE, 0, 0,

         MOVE_DISTANCE, 0, 0,

        -MOVE_DISTANCE, 0, 0

    ];


    const positionTrack =
        new THREE.VectorKeyframeTrack(
            ".position",
            times,
            positionValues
        );


    const animation =
        new THREE.AnimationClip(

            "photo-movement",

            MOVE_TIME,

            [
                positionTrack
            ]

        );


    /*
     * Экспортируем анимацию
     * внутрь GLB.
     */

    scene.animations = [
        animation
    ];



    /* =================================================
       ЭКСПОРТ GLB
    ================================================= */

    const exporter =
        new GLTFExporter();


    return new Promise(
        (resolve, reject) => {

            exporter.parse(

                scene,

                result => {

                    /*
                     * binary=true
                     * означает GLB.
                     */

                    const blob =
                        new Blob(
                            [result],
                            {
                                type:
                                    "model/gltf-binary"
                            }
                        );


                    const url =
                        URL.createObjectURL(
                            blob
                        );


                    resolve(url);

                },


                error => {

                    reject(error);

                },


                {
                    binary: true,

                    embedImages: true

                }

            );

        }
    );

}



/* =====================================================
   ЗАГРУЗКА IMAGE
===================================================== */

function loadImage(
    src
) {

    return new Promise(
        (resolve, reject) => {

            const image =
                new Image();


            image.onload =
                () => {

                    resolve(image);

                };


            image.onerror =
                () => {

                    reject(
                        new Error(
                            "Не удалось загрузить " +
                            src
                        )
                    );

                };


            image.src =
                src;

        }
    );

}



/* =====================================================
   ПОДГОТОВКА
===================================================== */

async function prepare() {

    loading.classList.remove(
        "hidden"
    );


    try {

        const modelURL =
            await createARModel();


        /*
         * Передаём автоматически
         * созданный GLB в model-viewer.
         */

        modelViewer.src =
            modelURL;


        /*
         * Ждём полной загрузки.
         */

        await modelViewer.updateComplete;


        await new Promise(
            resolve => {

                if(
                    modelViewer.loaded
                ) {

                    resolve();

                }

                else {

                    modelViewer.addEventListener(
                        "load",
                        resolve,
                        {
                            once: true
                        }
                    );

                }

            }
        );


        /*
         * Теперь кнопку можно нажать.
         */

        openArBtn.disabled =
            false;


        loading.classList.add(
            "hidden"
        );


    } catch(error) {

        console.error(error);


        loading.classList.add(
            "hidden"
        );


        showMessage(
            "Не удалось подготовить фото",
            "Проверь, что файл " +
            "izbushka_card.jpg " +
            "лежит рядом с index.html."
        );

    }

}



/* =====================================================
   ЗАПУСК AR
===================================================== */

openArBtn.addEventListener(
    "click",
    async () => {

        try {

            /*
             * Именно тот механизм,
             * который использовался
             * в твоём рабочем сайте.
             */

            await modelViewer.activateAR();

        } catch(error) {

            console.error(
                "AR error:",
                error
            );


            /*
             * Если настоящее AR
             * недоступно, показываем
             * обычный 3D просмотрщик.
             */

            welcomeScreen.classList.add(
                "hidden"
            );


            viewerContainer.classList.remove(
                "hidden"
            );

        }

    }
);



/* =====================================================
   ПОДГОТОВКА КАМЕРЫ
===================================================== */

modelViewer.addEventListener(
    "ar-status",
    event => {

        console.log(
            "AR:",
            event.detail.status
        );

    }
);



/* =====================================================
   ЗАКРЫТИЕ ОКНА ОШИБКИ
===================================================== */

messageClose.addEventListener(
    "click",
    () => {

        message.classList.add(
            "hidden"
        );

        message.classList.remove(
            "flex"
        );

    }
);



function showMessage(
    title,
    text
) {

    messageTitle.textContent =
        title;


    messageText.textContent =
        text;


    message.classList.remove(
        "hidden"
    );


    message.classList.add(
        "flex"
    );

}



/* =====================================================
   ЗАПУСК ПОДГОТОВКИ
===================================================== */

prepare();

</script>

</body>
</html>
